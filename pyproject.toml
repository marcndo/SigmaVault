[project]
name = "sigmavault"
version = "0.1.0"
description = "Autonomous business treasury decision system"
readme = "README.md"
authors = [
    { name = "marcndo", email = "ndowahmarcel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beancount>=3.2.3",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "pydantic-ai-slim[openai]>=2.56.0",
    "python-dotenv>=1.2.4",
    "web3>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
